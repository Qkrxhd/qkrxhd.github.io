<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="KooAsak!은 게임과 일상에 쓰이는 모바일 앱을 만드는 독립 스튜디오입니다. 첫 게임 장기 러쉬를 소개합니다.">
  <meta name="theme-color" content="#f5f7fc">
  <title>KooAsak! | 독립 앱 스튜디오</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
      color: #15203a;
      background: #f5f7fc;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }
    a { color: inherit; }
    a:focus-visible { outline: 3px solid #264de0; outline-offset: 5px; }
    .wrap { width: min(64rem, 100% - 3rem); margin-inline: auto; }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-height: 4.5rem;
      border-bottom: 1px solid #d8dfef;
    }
    .brand { font-weight: 800; letter-spacing: -.06em; font-size: 1.375rem; text-decoration: none; }
    .brand span, h1 span { color: #284fc5; }
    nav a { display: inline-flex; min-height: 2.75rem; align-items: center; text-underline-offset: .26em; }
    .intro { padding-block: clamp(3rem, 8vw, 5.5rem) clamp(2.5rem, 5vw, 4rem); }
    .eyebrow { margin: 0 0 1rem; font-size: .875rem; font-weight: 700; letter-spacing: .045em; }
    h1 {
      margin: 0;
      font-size: clamp(3.6rem, 12vw, 8rem);
      line-height: .96;
      font-weight: 900;
      letter-spacing: -.085em;
    }
    .line { margin: 1.4rem 0 .55rem; font-size: clamp(1.35rem, 4vw, 2.125rem); font-weight: 700; letter-spacing: -.04em; }
    .intro p:last-child { margin: 0; max-width: 34rem; color: #47536c; line-height: 1.7; }
    .project {
      display: grid;
      grid-template-columns: minmax(0, 16rem) minmax(0, 1fr);
      align-items: center;
      gap: clamp(1.4rem, 5vw, 3.5rem);
      padding: clamp(1.25rem, 4vw, 2.5rem);
      background: #0b1835;
      color: #f6f9ff;
      border-radius: 1.625rem;
    }
    .project img { display: block; width: 100%; height: auto; border-radius: 1.05rem; }
    .project .eyebrow { color: #72e5fc; }
    h2 { margin: 0; font-size: clamp(2rem, 6vw, 3.5rem); line-height: 1.17; letter-spacing: -.06em; }
    .project p:not(.eyebrow) { color: #c7d6f1; line-height: 1.7; max-width: 30rem; }
    .status {
      display: inline-block;
      padding: .46rem .7rem;
      border: 1px solid #536b9e;
      border-radius: .45rem;
      font-size: .875rem;
      font-weight: 700;
      color: #e3edff;
    }
    footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: .5rem 1.5rem;
      padding-block: 1.75rem 2.5rem;
      color: #47536c;
      font-size: .875rem;
      line-height: 1.65;
    }
    footer p { margin: 0; }
    @media (max-width: 38rem) {
      .wrap { width: calc(100% - 2rem); }
      .project { grid-template-columns: minmax(0, 1fr); }
      .project img { width: min(100%, 17rem); }
    }
  </style>
</head>
<body>
  <header class="wrap top" id="top">
    <a class="brand" href="#top">KooAsak<span>!</span></a>
    <nav aria-label="메인 메뉴"><a href="#janggi-rush">장기 러쉬</a></nav>
  </header>
  <main class="wrap">
    <section class="intro" aria-labelledby="studio-title">
      <p class="eyebrow">독립 앱 스튜디오</p>
      <h1 id="studio-title">KooAsak<span>!</span></h1>
      <p class="line">게임부터 패션·생활 앱까지.</p>
      <p>게임도 만들고, 일상에서 자주 쓰는 앱도 만듭니다. 첫 게임은 장기에서 영감을 얻은 장기 러쉬입니다.</p>
    </section>
    <section class="project" id="janggi-rush" aria-labelledby="game-title">
      <img src="janggi-rush.png" width="1254" height="1254" alt="네온 격자 위에서 두 장기 기물이 맞부딪치는 장기 러쉬 아이콘">
      <div>
        <p class="eyebrow">첫 번째 게임</p>
        <h2 id="game-title">장기 러쉬</h2>
        <p>장기 기물의 행마법을 바탕으로 다음 수를 읽고, 연속으로 적 기물을 잡아 점수를 쌓는 1인용 보드 게임입니다.</p>
        <span class="status">Android 출시 준비 중</span>
      </div>
    </section>
  </main>
  <footer class="wrap">
    <p>KooAsak!</p>
    <p>장기 러쉬의 지원 채널과 개인정보처리방침은 출시 전에 안내할 예정입니다.</p>
  </footer>
</body>
</html>
